<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagined World · Digital Escapism</title>
  <meta name="description" content="Imagined World: a bright place to explore, part of Digital Escapism.">
  <meta name="theme-color" content="#1c2a66">

  <!-- Única dependencia externa: tipografía Fraunces (SIL Open Font License) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap">

  <link rel="stylesheet" href="css/imagined.css">
</head>
<body class="iw-body">

  <!-- ============ CIELO Y PAISAJE LEJANO (fijos, con parallax) ============ -->
  <div class="iw-sky" aria-hidden="true">
    <div class="iw-stars" id="iw-stars"></div>
    <span class="iw-sun"></span>
    <span class="iw-cloud iw-cloud--1"></span>
    <span class="iw-cloud iw-cloud--2"></span>
    <span class="iw-cloud iw-cloud--3"></span>
  </div>

  <div class="iw-layer iw-layer--far" data-depth="0.12" aria-hidden="true">
    <svg viewBox="0 0 1000 300" preserveAspectRatio="none">
      <path d="M0 300 L0 170 L60 122 L120 158 L190 92 L262 150 L332 112 L402 160 L470 80 L542 140 L612 102 L682 150 L752 72 L822 132 L892 100 L960 150 L1000 122 L1000 300 Z"/>
    </svg>
  </div>
  <div class="iw-layer iw-layer--mid" data-depth="0.32" aria-hidden="true">
    <svg viewBox="0 0 1000 300" preserveAspectRatio="none">
      <path d="M0 300 L0 200 Q80 140 160 190 T320 182 T480 168 T640 192 T800 160 T1000 186 L1000 300 Z"/>
    </svg>
  </div>
  <div class="iw-layer iw-layer--near" data-depth="0.62" aria-hidden="true">
    <svg viewBox="0 0 1000 300" preserveAspectRatio="none">
      <path d="M0 300 L0 232 Q100 190 200 226 T400 214 T600 232 T800 208 T1000 226 L1000 300 Z"/>
    </svg>
  </div>

  <canvas class="iw-particles" id="iw-particles" aria-hidden="true"></canvas>

  <!-- ============ EL MUNDO (se recorre en horizontal) ============ -->
  <main class="iw-world" id="iw-world" aria-label="The imagined world">
    <div class="iw-track" id="iw-track">

      <!-- Arrival / The Threshold -->
      <section class="iw-zone iw-zone--threshold" id="iw-threshold" aria-labelledby="iw-arrival">
        <div class="iw-ground" aria-hidden="true"></div>
        <div class="iw-threshold__text">
          <p class="iw-kicker" id="iw-kicker">You left the room.</p>
          <h1 class="iw-arrival" id="iw-arrival">You came from somewhere.</h1>
          <button class="iw-step" id="iw-step" type="button">Step in</button>
        </div>
      </section>

      <!-- The Open World -->
      <section class="iw-zone iw-zone--open" id="iw-open" aria-label="The open world">
        <div class="iw-ground" aria-hidden="true"></div>
        <div class="iw-grass" id="iw-grass" aria-hidden="true"></div>
        <div class="iw-extras" id="iw-extras" aria-hidden="true"><!-- world-interactions.js --></div>
        <div class="iw-discoveries" id="iw-discoveries"><!-- world-interactions.js --></div>
      </section>

      <!-- The Quiet Edge -->
      <section class="iw-zone iw-zone--edge" id="iw-edge" aria-labelledby="iw-edge-title">
        <div class="iw-water" aria-hidden="true">
          <span class="iw-water__shine"></span>
          <div class="iw-reflection" id="iw-reflection"></div>
        </div>
        <div class="iw-edge__text">
          <h2 class="iw-visually-hidden" id="iw-edge-title">The quiet edge</h2>
          <div class="iw-edge__lines" id="iw-edge-lines" aria-live="polite"></div>
          <div class="iw-edge__actions" id="iw-edge-actions" hidden>
            <a class="iw-return" id="iw-return" href="../muted-world/index.html">Return to your room</a>
            <button class="iw-stay" id="iw-stay" type="button">Stay a little longer</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- ============ INTERFAZ ============ -->
  <nav class="iw-zones" aria-label="Places in the imagined world">
    <button type="button" data-zone="iw-threshold" aria-current="true">Threshold</button>
    <button type="button" data-zone="iw-open">Open world</button>
    <button type="button" data-zone="iw-edge">Quiet edge</button>
  </nav>

  <p class="iw-response" id="iw-response" aria-live="polite"></p>

  <!-- ============ REELS: si se entró con el celular (reels.js) ============ -->
  <section class="iw-reels" id="iw-reels" aria-label="Short videos" hidden>
    <div class="iw-reels__top" aria-hidden="true">
      <span class="iw-reels__tab">Following</span>
      <span class="iw-reels__tab iw-reels__tab--on">For you</span>
    </div>

    <div class="iw-reels__stage">
      <div class="iw-reels__phone">
        <div class="iw-reels__screen" id="iw-reels-screen"><!-- reels.js --></div>
      </div>

      <div class="iw-reels__rail">
        <button class="iw-reels__btn" id="iw-reels-like" type="button" aria-label="Like this video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
          <span id="iw-reels-likes">0</span>
        </button>
        <button class="iw-reels__btn" id="iw-reels-next" type="button" aria-label="Next video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M5.5 11.5 12 18l6.5-6.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Next</span>
        </button>
        <button class="iw-reels__btn iw-reels__btn--down" id="iw-reels-close" type="button" aria-label="Put the phone down and look around">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="17" rx="2.4" fill="none" stroke-width="2"/><path d="M4 21.5h16" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Put down</span>
        </button>
      </div>
    </div>

    <p class="iw-reels__meter"><span class="iw-reels__dot" aria-hidden="true"></span><span id="iw-reels-meter">0 videos · 0 min</span></p>
  </section>

  <!-- Volver a tomar el celular (aparece al dejarlo) -->
  <button class="iw-reels-reopen" id="iw-reels-reopen" type="button" aria-label="Pick up the phone again" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.4" fill="none" stroke-width="2"/><circle cx="12" cy="18" r="1.1"/></svg>
  </button>

  <!-- PORTAL a la realidad: gris, parpadea y llama la atención cada vez más -->
  <a class="iw-portal" id="iw-portal" href="../muted-world/index.html" aria-label="A crack back to your room. Return to the real world">
    <span class="iw-portal__ring" aria-hidden="true"></span>
    <span class="iw-portal__door" aria-hidden="true"><span class="iw-portal__crack"></span></span>
    <span class="iw-portal__msg" id="iw-portal-msg" aria-hidden="true"></span>
  </a>

  <button class="iw-mute" id="iw-mute" type="button" aria-pressed="true">sound off</button>

  <!-- Llegada: el blanco con el que se salió del Muted World se abre en color -->
  <div class="iw-flash" id="iw-flash" aria-hidden="true"></div>

  <noscript>
    <p class="iw-noscript">This world needs JavaScript to open.</p>
  </noscript>

  <!-- Scripts clásicos (funcionan también con doble clic). El orden importa. -->
  <script src="js/scene-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/residual-motif.js"></script>
  <script src="js/world-interactions.js"></script>
  <script src="js/media-links.js"></script>   <!-- ← tus 10 links -->
  <script src="js/reels.js"></script>
  <script src="js/imagined.js"></script>
</body>
</html>
