<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagined World · Digital Escapism</title>
  <meta name="description" content="Imagined World: what the device gives you. Part of Digital Escapism.">
  <meta name="theme-color" content="#0e0a20">

  <!-- Única dependencia externa: tipografía Fraunces (SIL Open Font License) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&display=swap">

  <link rel="stylesheet" href="css/imagined.css">     <!-- base, portal, reels -->
  <link rel="stylesheet" href="css/experiences.css">  <!-- series, juego, música, decisiones, VR, construir -->
</head>
<body class="iw-body">

  <!-- ============ LA EXPERIENCIA DEL APARATO (la monta js/exp-*.js) ============ -->
  <main class="iw-stage" id="iw-stage" aria-label="The imagined world"></main>

  <!-- ============ REELS: el celular (reels.js) ============ -->
  <section class="iw-reels" id="iw-reels" aria-label="Short videos" hidden>
    <div class="iw-reels__top" aria-hidden="true">
      <span class="iw-reels__tab">Following</span>
      <span class="iw-reels__tab iw-reels__tab--on">For you</span>
    </div>

    <div class="iw-reels__stage">
      <div class="iw-reels__phone">
        <div class="iw-reels__screen" id="iw-reels-screen"><!-- reels.js --></div>
      </div>

      <div class="iw-reels__rail">
        <button class="iw-reels__btn" id="iw-reels-like" type="button" aria-label="Like this video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
          <span id="iw-reels-likes">0</span>
        </button>
        <button class="iw-reels__btn" id="iw-reels-next" type="button" aria-label="Next video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M5.5 11.5 12 18l6.5-6.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Next</span>
        </button>
      </div>
    </div>

    <p class="iw-reels__meter"><span class="iw-reels__dot" aria-hidden="true"></span><span id="iw-reels-meter">0 videos · 0 min</span></p>
  </section>

  <p class="iw-toast" id="iw-toast" aria-live="polite"></p>

  <!-- PORTAL a la realidad: gris, parpadea y llama la atención cada vez más -->
  <a class="iw-portal" id="iw-portal" href="../muted-world/index.html" aria-label="A crack back to your room. Return to the real world">
    <span class="iw-portal__ring" aria-hidden="true"></span>
    <span class="iw-portal__door" aria-hidden="true"><span class="iw-portal__crack"></span></span>
    <span class="iw-portal__msg" id="iw-portal-msg" aria-hidden="true"></span>
  </a>

  <button class="iw-mute" id="iw-mute" type="button" aria-pressed="true">sound off</button>

  <!-- Llegada: el blanco de la transición se abre -->
  <div class="iw-flash" id="iw-flash" aria-hidden="true"></div>

  <noscript>
    <p class="iw-noscript">This world needs JavaScript to open.</p>
  </noscript>

  <!-- Scripts clásicos (funcionan también con doble clic). El orden importa. -->
  <script src="js/scene-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/residual-motif.js"></script>
  <script src="js/media-links.js"></script>   <!-- ← tus 10 links -->
  <script src="js/reels.js"></script>         <!-- celular -->
  <script src="js/exp-video.js"></script>     <!-- portátil -->
  <script src="js/exp-online.js"></script>    <!-- mando -->
  <script src="js/music-tracks.js"></script>  <!-- ← las canciones de los audífonos -->
  <script src="js/exp-music.js"></script>     <!-- audífonos -->
  <script src="js/exp-choice.js"></script>    <!-- computadora -->
  <script src="js/exp-vr.js"></script>        <!-- lentes VR -->
  <script src="js/exp-sandbox.js"></script>   <!-- consola portátil -->
  <script src="js/imagined.js"></script>
</body>
</html>
