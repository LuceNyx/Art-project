  <g filter="url(#r)" transform="rotate(-6 100 100)" stroke="#111" stroke-width="3">
    <rect x="46" y="30" width="108" height="134" fill="#e6e6e6"/>
    <rect x="56" y="40" width="88" height="90" fill="#f6f6f6" stroke="#9a9a9a" stroke-width="1.5"/>
  </g>
</svg>
