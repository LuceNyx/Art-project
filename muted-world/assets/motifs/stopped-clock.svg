<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Motif: a clock stopped at seven">
  <!-- Motivo "stopped-clock" (Lack of control). Escala de grises, fondo transparente. -->
  <defs><filter id="r" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs>
  <g filter="url(#r)">
    <circle cx="100" cy="100" r="78" fill="#1a1a1a"/>
    <circle cx="100" cy="100" r="66" fill="#d6d6d6" stroke="#111" stroke-width="3"/>
    <path d="M100 42 V54 M100 146 V158 M42 100 H54 M146 100 H158" stroke="#333" stroke-width="5"/>
    <path d="M100 100 L100 50" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 100 L72 146" stroke="#111" stroke-width="9" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="6" fill="#111"/>
</svg>
